<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Book</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1e2230;
      --muted: #5f6b85;
      --border: #e0e6f0;
      --primary: #3d6af2;
      --shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    header {
      padding: 48px 24px 24px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    .content {
      max-width: 900px;
      margin: 0 auto 80px;
      padding: 0 24px;
    }
    .chapter {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .chapter h2 {
      margin-top: 0;
      color: var(--primary);
    }
    section {
      margin-top: 20px;
    }
    section h3 {
      margin-bottom: 6px;
    }
    .section-content {
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <h1>My Book</h1>
    <p>Read-only public book</p>
  </header>
  <main class="content">
    <article class="chapter">
      <h2>Chapter 1</h2>
      <section>
        <h3>Introduction</h3>
        <div class="section-content">
          <p>Welcome to your book. Start editing this section.</p>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
